name: auto-merge-dependabot
on: [pull_request_target]
env:
  PR_URL: ${{ github.event.pull_request.html_url }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  auto-merge-dependabot:
    runs-on: ubuntu-latest
    # Only dependabot. A PR auto-merged here is merged with GITHUB_TOKEN, and
    # GitHub does not start workflow runs for pushes made with that token — so
    # anything merged this way never runs `ci` on master, and never reaches the
    # publish step. That silently swallowed the 2.0.0 release.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
      - name: auto-approve
        run: gh pr review --approve "$PR_URL"
